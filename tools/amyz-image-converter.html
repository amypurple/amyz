<style>

    --bg: #141416; --surface: #1d1d21; --surface-2: #26262b; --text: #ececef; --muted: #a9abb3;

}
:root[data-theme="dark"] {
  --bg: #141416; --surface: #1d1d21; --surface-2: #26262b; --text: #ececef; --muted: #a9abb3;
  --border: #3d3e45; --accent: #b79bf2; --accent-text: #160a2e; --accent-soft: #2c2340;

<script>
'use strict';
// conv.js - image conversion core of the Amy image converter (no DOM, no network).
// Input: an RGB image { w, h, rgb: Uint8Array (w*h*3) }. Output: raw machine files.
// Machines: TMS9918A mode 2, C64 hires and multicolour, Game Boy 2bpp, NES.
// The Game Boy and NES paths follow ports/gb/gb_convert.py and ports/nes/nes_convert2.py
// step by step (same arithmetic, same tie-breaking), so a TMS9918A-palette source gives
// byte-identical files.
'use strict';
const CONV = (() => {

// ---------------------------------------------------------------- palettes
const hexPal = (s) => s.split(' ').map((h) => [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]);
const PALETTES = {
  tms: { mame: { name: 'TMS9918A (MAME / blueMSX)', rgb: hexPal('000000 000000 21C842 5EDC78 5455ED 7D76FC D4524D 42EBF5 FC5554 FF7978 D4C154 E6CE80 21B03B C95BBA CCCCCC FFFFFF') } },
  c64: {
    pepto: { name: 'C64 Pepto (PAL)', rgb: hexPal('000000 FFFFFF 68372B 70A4B2 6F3D86 588D43 352879 B8C76F 6F4F25 433900 9A6759 444444 6C6C6C 9AD284 6C5EB5 959595') },
    colodore: { name: 'C64 Colodore', rgb: hexPal('000000 FFFFFF 813338 75CEC8 8E3C97 56AC4D 2E2C9B EDF171 8E5029 553800 C46C71 4A4A4A 7B7B7B A9FF9F 706DEB B2B2B2') },
  },
  gb: {
    grey: { name: 'Game Boy, grey', rgb: hexPal('FFFFFF AAAAAA 555555 000000') },
    dmg: { name: 'Game Boy, DMG green', rgb: hexPal('E0F8D0 88C070 346856 081820') },
  },
  nes: { ntsc: { name: 'NES 2C02 (FCEUX-style)', rgb: hexPal('7C7C7C 0000FC 0000BC 4428BC 940084 A80020 A81000 881400 503000 007800 006800 005800 004058 000000 000000 000000 BCBCBC 0078F8 0058F8 6844FC D800CC E40058 F83800 E45C10 AC7C00 00B800 00A800 00A844 008888 000000 000000 000000 F8F8F8 3CBCFC 6888FC 9878F8 F878F8 F85898 F87858 FCA044 F8B800 B8F818 58D854 58F898 00E8D8 787878 000000 000000 FCFCFC A4E4FC B8B8F8 D8B8F8 F8B8F8 F8A4C0 F0D0B0 FCE0A8 F8D878 D8F878 B8F8B8 B8F8D8 00FCFC F8D8F8 000000 000000') } },
};
// NES colours that are usable (no duplicates of black, no $0D)
const NES_USABLE = [];
for (let i = 0; i < 64; i++) { const lo = i & 15; if (lo >= 0x0D && i !== 0x0F) continue; if (i === 0x0D) continue; NES_USABLE.push(i); }
// the TMS9918A -> NES colour table of nes_convert2.py (used when the source is in the TMS palette)
const TMS2NES = { 0: 0x0F, 1: 0x0F, 2: 0x1A, 3: 0x2A, 4: 0x12, 5: 0x22, 6: 0x06, 7: 0x2C, 8: 0x16, 9: 0x26, 10: 0x28, 11: 0x38, 12: 0x0A, 13: 0x14, 14: 0x10, 15: 0x30 };

// ---------------------------------------------------------------- geometry
// box-filter resample of one float plane (same loops as gb_convert.py)
function resamplePlane(src, W, H, PW, PH) {
  const sx = W / PW, sy = H / PH, out = new Float64Array(PW * PH);
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
    const x0 = x * sx, x1 = (x + 1) * sx, y0 = y * sy, y1 = (y + 1) * sy;
    let acc = 0, wsum = 0;
    for (let yy = Math.trunc(y0); yy < Math.min(H, Math.trunc(y1 + 0.999)); yy++) {
      const wy = Math.min(y1, yy + 1) - Math.max(y0, yy);
      for (let xx = Math.trunc(x0); xx < Math.min(W, Math.trunc(x1 + 0.999)); xx++) {
        const wx = Math.min(x1, xx + 1) - Math.max(x0, xx), w = wx * wy;
        if (w > 0) { acc += w * src[yy * W + xx]; wsum += w; }
      }
    }
    out[y * PW + x] = acc / wsum;
  }
  return out;
}
// place the source on a SW x SH screen: 'fit' keeps the whole picture (letterbox), 'fill' crops.
// Returns the source window, the destination rectangle (snapped to the grid) and the scale.
function layout(img, SW, SH, opt, snapX, snapY, pixAspect = 1) {
  const fit = opt.fit || 'fit';
  const sw = img.w * pixAspect;                       // source width in screen pixels
  let s = fit === 'fill' ? Math.max(SW / sw, SH / img.h) : Math.min(SW / sw, SH / img.h);
  if (fit === 'none') s = 1;
  let dw = Math.min(SW, Math.round(sw * s)), dh = Math.min(SH, Math.round(img.h * s));
  // source window (crop)
  const cw = Math.min(img.w, Math.round(dw / s / pixAspect)), ch = Math.min(img.h, Math.round(dh / s));
  const ox = Math.round((img.w - cw) * (opt.cropX ?? 0.5)), oy = Math.round((img.h - ch) * (opt.cropY ?? 0.5));
  const dx = Math.floor((SW - dw) / 2 / snapX) * snapX, dy = Math.floor((SH - dh) / 2 / snapY) * snapY;
  return { ox, oy, cw, ch, dx, dy, dw, dh };
}
function cropPlane(plane, W, L) {
  if (L.ox === 0 && L.oy === 0 && L.cw === W) return plane.subarray ? plane.subarray(0, L.cw * L.ch) : plane;
  const o = new Float64Array(L.cw * L.ch);
  for (let y = 0; y < L.ch; y++) for (let x = 0; x < L.cw; x++) o[y * L.cw + x] = plane[(y + L.oy) * W + x + L.ox];
  return o;
}
// brightness / contrast on a float value (0..255); identity at 0, 0
function adjust(v, b, c) {
  if (!b && !c) return v;
  const k = (100 + c) / 100;
  v = (v - 128) * k * k + 128 + b * 1.28;
  return v < 0 ? 0 : v > 255 ? 255 : v;
}
// RGB planes resampled into the destination rectangle of a SW x SH screen (border = black)
function screenRGB(img, SW, SH, opt, snapX, snapY, pixAspect = 1) {
  const L = layout(img, SW, SH, opt, snapX, snapY, pixAspect);
  const planes = [0, 1, 2].map((ch) => {
    const p = new Float64Array(img.w * img.h);
    for (let i = 0; i < p.length; i++) p[i] = adjust(img.rgb[i * 3 + ch], opt.brightness || 0, opt.contrast || 0);
    const c = cropPlane(p, img.w, L);
    return (L.cw === L.dw && L.ch === L.dh) ? Float64Array.from(c) : resamplePlane(c, L.cw, L.ch, L.dw, L.dh);
  });
  const out = new Float64Array(SW * SH * 3), inside = new Uint8Array(SW * SH);
  for (let y = 0; y < L.dh; y++) for (let x = 0; x < L.dw; x++) {
    const d = (y + L.dy) * SW + x + L.dx, s = y * L.dw + x;
    out[d * 3] = planes[0][s]; out[d * 3 + 1] = planes[1][s]; out[d * 3 + 2] = planes[2][s]; inside[d] = 1;
  }
  return { rgb: out, inside, L };
}

// ---------------------------------------------------------------- quantising
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const d2 = (r, g, b, p) => (r - p[0]) ** 2 + (g - p[1]) ** 2 + (b - p[2]) ** 2;
function nearest(r, g, b, pal, allowed) {
  let bi = allowed[0], bd = Infinity;
  for (const i of allowed) { const d = d2(r, g, b, pal[i]); if (d < bd) { bd = d; bi = i; } }
  return bi;
}
// quantise an RGB float screen to palette indices (allowed = index list), with dithering

try { const m = localStorage.getItem('amyz-imgconv-machine'); if (MACHINES.some((x) => x[0] === m)) machine = m; } catch (e) {}

// The artifact host only allows common file types, so each output is
// wrapped in a small .zip (stored, no compression) before it is offered.
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xffffffff; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
function zipOne(name, data) {
  const nm = new TextEncoder().encode(name), crc = crc32(data), n = data.length;
  const out = new Uint8Array(30 + nm.length + n + 46 + nm.length + 22), v = new DataView(out.buffer);
  let p = 0;
  v.setUint32(p, 0x04034b50, true); v.setUint16(p + 4, 20, true); v.setUint32(p + 14, crc, true);
  v.setUint32(p + 18, n, true); v.setUint32(p + 22, n, true); v.setUint16(p + 26, nm.length, true);
  out.set(nm, p + 30); out.set(data, p + 30 + nm.length); p = 30 + nm.length + n;
  const cd = p;
  v.setUint32(p, 0x02014b50, true); v.setUint16(p + 4, 20, true); v.setUint16(p + 6, 20, true);
  v.setUint32(p + 16, crc, true); v.setUint32(p + 20, n, true); v.setUint32(p + 24, n, true);
  v.setUint16(p + 28, nm.length, true); out.set(nm, p + 46); p += 46 + nm.length;
  v.setUint32(p, 0x06054b50, true); v.setUint16(p + 8, 1, true); v.setUint16(p + 10, 1, true);
  v.setUint32(p + 12, p - cd, true); v.setUint32(p + 16, cd, true);

}
let downloadsNs;
const downloadsReady = (window.claude && window.claude.use) ? window.claude.use('downloads').then((d) => { downloadsNs = d; return d; }).catch(() => null) : Promise.resolve(null);
function blobSave(name, bytes) {
  const blob = new Blob([bytes], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
function offerFile(name, bytes) {
  const data = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  const zipName = name + '.zip', zipped = zipOne(name, data);
  if (downloadsNs) {
    downloadsNs.save({ filename: zipName, data: zipped }).catch((e) => {
      const code = e && e.code;
      if (code === 'declined') return;
      const msg = lang === 'en' ? 'Saving is not available here (' + code + ').' : "L'enregistrement n'est pas disponible ici (" + code + ').';
      const st = (document.getElementById('status')||document.querySelector('[role=status]')); if (st) st.textContent = msg;
    });
  } else blobSave(zipName, zipped);
}
window.offerFile = offerFile;

function applyTexts() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  $('langBtn').textContent = lang === 'fr' ? 'English' : 'Français';
  $('langBtn').setAttribute('aria-label', lang === 'fr' ? 'Switch to English' : 'Passer en français');
  updateTheme(); renderMachines(); renderOptions(); if (result) renderResult();
}
function updateTheme() { const th = document.documentElement.dataset.theme || 'auto'; $('themeBtn').textContent = t(th === 'light' ? 'themeLight' : th === 'dark' ? 'themeDark' : 'themeAuto'); }
function renderMachines() {
  const box = $('targets'); box.textContent = '';
  for (const [id, n, sub] of MACHINES) {
    const l = document.createElement('label'), i = document.createElement('input');
    i.type = 'radio'; i.name = 'machine'; i.value = id; i.checked = id === machine;
    i.addEventListener('change', () => { machine = id; try { localStorage.setItem('amyz-imgconv-machine', id); } catch (e) {} renderOptions(); schedule(); });
    const a = document.createElement('span'); a.className = 't-name'; a.textContent = t(n);
    const b = document.createElement('span'); b.className = 't-cpu'; b.textContent = t(sub);
    l.append(i, a, b); box.append(l);
  }
}
function renderOptions() {
  const fam = MACHINES.find((m) => m[0] === machine)[3], sel = $('palette'), keep = sel.dataset.fam === fam ? sel.value : null;
  sel.textContent = ''; sel.dataset.fam = fam;
  for (const [k, p] of Object.entries(CONV.PALETTES[fam])) { const o = document.createElement('option'); o.value = k; o.textContent = p.name; sel.append(o); }
  if (keep) sel.value = keep;
  $('optTms').classList.toggle('hidden', machine !== 'tms');
  $('optGb').classList.toggle('hidden', machine !== 'gb');
  $('optNes').classList.toggle('hidden', machine !== 'nes');
  $('thBox').classList.toggle('hidden', $('levels').value !== 'manual');
  const fill = $('fit').value === 'fill';
  $('cropXBox').classList.toggle('hidden', !fill); $('cropYBox').classList.toggle('hidden', !fill);
  $('protectInfo').textContent = protect ? `(${protect[0]}, ${protect[1]}) - (${protect[2]}, ${protect[3]})` : '';
}
function options() {
  return {
    fit: $('fit').value, cropX: +$('cropX').value / 100, cropY: +$('cropY').value / 100, palette: $('palette').value,
    dither: $('dither').value, strength: +$('strength').value, brightness: +$('brightness').value, contrast: +$('contrast').value,
    dedup: $('dedup').checked, normalize: $('normalize').checked, levels: $('levels').value, thresholds: [+$('th0').value, +$('th1').value, +$('th2').value].sort((a, b) => a - b),
    protect, sprites: $('sprites').checked, nesMap: $('nesMap').value,
  };
}
function schedule() { clearTimeout(timer); timer = setTimeout(run, 60); }
function run() {
  if (!srcImg) { $('status').textContent = t('noImage'); return; }
  try {
    const t0 = performance.now();
    result = CONV.convert(machine, srcImg, options());
    result.ms = Math.round(performance.now() - t0);
    $('status').textContent = ''; $('status').className = 'status';
    renderResult();
  } catch (e) { result = null; $('status').textContent = t('error') + e.message; $('status').className = 'status error'; $('outputs').textContent = ''; }
}
function drawIdx(canvas, pv) {
  canvas.width = pv.w; canvas.height = pv.h;
  const ctx = canvas.getContext('2d'), im = ctx.createImageData(pv.w, pv.h);
  for (let i = 0; i < pv.w * pv.h; i++) { const c = pv.pal[pv.idx[i]]; im.data.set([c[0], c[1], c[2], 255], i * 4); }
  ctx.putImageData(im, 0, 0);
}
function drawOrig(canvas, pv) {
  // the source framed exactly as the converter frames it (same layout, nearest sampling for display)
  const fam = machine === 'c64m' ? 0.5 : 1, SW = pv.w, SH = pv.h;
  const snapX = machine === 'c64m' ? 4 : 8, snapY = machine === 'nes' ? 16 : 8;
  const L = CONV.layout(srcImg, SW, SH, options(), snapX, snapY, fam);
  canvas.width = SW; canvas.height = SH;
  const ctx = canvas.getContext('2d'), im = ctx.createImageData(SW, SH);
  for (let i = 0; i < SW * SH; i++) im.data.set([0, 0, 0, 255], i * 4);
  for (let y = 0; y < L.dh; y++) for (let x = 0; x < L.dw; x++) {
    const sx = L.ox + Math.min(L.cw - 1, Math.floor((x + 0.5) * L.cw / L.dw)), sy = L.oy + Math.min(L.ch - 1, Math.floor((y + 0.5) * L.ch / L.dh));
    const s = (sy * srcImg.w + sx) * 3, d = ((y + L.dy) * SW + x + L.dx) * 4;
    im.data.set([srcImg.rgb[s], srcImg.rgb[s + 1], srcImg.rgb[s + 2], 255], d);
  }
  ctx.putImageData(im, 0, 0);
}
function sizeCanvas(c, pv) { const z = +$('zoom').value; c.style.width = pv.w * z * (pv.aspect || 1) + 'px'; c.style.height = pv.h * z + 'px'; }
function renderResult() {
  const pv = result.preview;
  drawIdx($('prevCanvas'), pv); drawOrig($('origCanvas'), pv);
  if (machine === 'nes' && protect) { const ctx = $('prevCanvas').getContext('2d'); ctx.strokeStyle = '#ff00ff'; ctx.strokeRect(protect[0] + 0.5, protect[1] + 0.5, protect[2] - protect[0] - 1, protect[3] - protect[1] - 1); }
  sizeCanvas($('prevCanvas'), pv); sizeCanvas($('origCanvas'), pv);
  const pct = (100 * result.changed / result.total).toFixed(2);
  $('stat').innerHTML = ''; const s1 = document.createElement('span'); s1.textContent = t('changed');
  const s2 = document.createElement('strong'); s2.id = 'changedCount'; s2.textContent = result.changed.toLocaleString(lang === 'fr' ? 'fr-CA' : 'en-CA');
  const s3 = document.createElement('span'); s3.textContent = t('of') + result.total.toLocaleString(lang === 'fr' ? 'fr-CA' : 'en-CA') + ' (' + pct + ' %)';
  $('stat').append(s1, s2, s3);
  const i = result.info, parts = [];
  if (i.tiles !== undefined && !Array.isArray(i.tiles)) parts.push(t('iTiles') + ' ' + i.tiles);
  if (i.uniq) parts.push(t('iUniq') + ' ' + i.uniq.join(' / '));
  if (i.background !== undefined) parts.push(t('iBg') + ' ' + i.background);
  if (i.levels) parts.push(t('iLevels') + ' ' + i.levels.join(', '));
  if (i.recoloured !== undefined) parts.push(t('iRecol') + ' ' + i.recoloured, t('iSprites') + ' ' + i.sprites, t('iTables') + ' ' + i.tiles.join(' / '), i.split, (i.tmsMap ? t('iTms') : t('nesMapNearest')));
  parts.push(result.ms + ' ms');
  $('infoLine').textContent = parts.join(' - ');
  const ul = $('outputs'); ul.textContent = '';
  const base = srcName.replace(/\.[^.]*$/, '').replace(/[^A-Za-z0-9_-]+/g, '_') || 'image';
  for (const f of result.files) {
    const li = document.createElement('li'), c = document.createElement('code');
    const fname = base + '_' + f.name;
    c.textContent = fname + ' (' + f.bytes.length + ' B)';
    const tag = document.createElement('span'); tag.className = 'addr-tag';
    tag.textContent = f.addr !== undefined ? '@$' + f.addr.toString(16).padStart(4, '0') + (f.note ? ' (' + f.note + ')' : '') : (f.note || '');
    const b = document.createElement('button'); b.type = 'button'; b.textContent = t('download'); b.setAttribute('aria-label', t('download') + ' ' + fname);
    b.addEventListener('click', () => offerFile(fname, f.bytes));
    const left = document.createElement('div'); left.append(c, document.createElement('br'), tag);
    li.append(left, b); ul.append(li);
  }
  $('outHint').textContent = machine.startsWith('c64') ? t('outHintC64') : t('outHintRaw');
  renderPletter();
}

// ---------------------------------------------------------------- Pletter + CVBasic (TMS9918A mode 2)
const hexb = (b) => '$' + b.toString(16).padStart(2, '0');
function dataLines(label, bytes) {
  const out = [label + ':'];
  for (let i = 0; i < bytes.length; i += 8) out.push('\tDATA BYTE ' + Array.from(bytes.subarray(i, i + 8), hexb).join(','));
  return out.join('\n');
}
let pletterToken = 0;
async function renderPletter() {
  const box = $('cvbBox');
  if (machine !== 'tms' || !$('pletter').checked || !result) { box.classList.add('hidden'); return; }
  const token = ++pletterToken, r = result;
  box.classList.remove('hidden'); $('cvbHint').textContent = t('cvbWorking'); $('cvbSrc').textContent = '';
  const [pat, col, nam] = ['pattern.bin', 'color.bin', 'name.bin'].map((n) => r.files.find((f) => f.name === n).bytes);
  const merged = $('dedup').checked;
  // form 0 (MODE 0): one set of at most 256 tiles shared by the three thirds
  // form 1 (MODE 1 bitmap), form 2 (MODE 1 with tiles merged per third + SCREEN names)
  let form = merged ? 2 : 1, chars = null;
  if (merged) {
    const keyOf = (cell) => Array.from(pat.subarray(cell * 8, cell * 8 + 8)).concat(Array.from(col.subarray(cell * 8, cell * 8 + 8))).join(',');
    const seen = new Map(), gname = new Uint8Array(768), order = [];
    for (let i = 0; i < 768; i++) {
      const cell = Math.floor(i / 256) * 256 + nam[i], k = keyOf(cell);
      if (!seen.has(k)) { seen.set(k, seen.size); order.push(cell); }
      gname[i] = seen.get(k) & 255;
    }
    if (seen.size <= 256) {
      form = 0;
      const cp = new Uint8Array(order.length * 8), cc = new Uint8Array(order.length * 8);
      order.forEach((cell, j) => { cp.set(pat.subarray(cell * 8, cell * 8 + 8), j * 8); cc.set(col.subarray(cell * 8, cell * 8 + 8), j * 8); });
      chars = { n: order.length, pat: cp, col: cc, name: gname };
    }
  }
  const codec = new PLETTER_LIB.PletterCodec();
  const zp = await codec.compress(form === 0 ? chars.pat : pat), zc = await codec.compress(form === 0 ? chars.col : col);
  const names = form === 0 ? chars.name : nam, zn = await codec.compress(names);
  if (token !== pletterToken) return;
  const base = srcName.replace(/\.[^.]*$/, '').replace(/[^A-Za-z0-9_-]+/g, '_') || 'image';
  const lines = ["\t' Generated by the Amy image converter (TMS9918A mode 2, Pletter 0.5c)", "\t' Source image: " + srcName.replace(/[^\x20-\x7e]/g, '_')];
  if (form === 0) {
    lines.push('\tMODE 0', '\tSCREEN DISABLE', `\tDEFINE CHAR PLETTER 0,${chars.n},image_char`, `\tDEFINE COLOR PLETTER 0,${chars.n},image_color`, '\tSCREEN image_names', '\tSCREEN ENABLE', '\tWHILE 1: WEND', '',
      dataLines('image_char', zp), '', dataLines('image_color', zc), '', dataLines('image_names', names));
  } else {
    lines.push('\tMODE 1', '\tSCREEN DISABLE', '\tDEFINE VRAM PLETTER $0000,$1800,image_bitmap', '\tDEFINE VRAM PLETTER $2000,$1800,image_color');
    if (form === 2) lines.push('\tSCREEN image_names');
    lines.push('\tSCREEN ENABLE', '\tWHILE 1: WEND', '', dataLines('image_bitmap', zp), '', dataLines('image_color', zc));
    if (form === 2) lines.push('', dataLines('image_names', names));
  }
  const bas = lines.join('\n') + '\n';
  $('cvbSrc').textContent = bas;
  $('cvbHint').textContent = t('cvbForm' + form) + ' (' + zp.length + ' + ' + zc.length + ' B)';
  const ul = $('outputs');
  for (const [n, b] of [[form === 0 ? 'chars_pattern.plet' : 'pattern.plet', zp], [form === 0 ? 'chars_color.plet' : 'color.plet', zc], [form === 0 ? 'chars_name.plet' : 'name.plet', zn], ['cvbasic.bas', new TextEncoder().encode(bas)]]) {
    const li = document.createElement('li'), c = document.createElement('code'), fname = base + '_' + n;
    c.textContent = fname + ' (' + b.length + ' B)';
    const bt = document.createElement('button'); bt.type = 'button'; bt.textContent = t('download'); bt.setAttribute('aria-label', t('download') + ' ' + fname);
    bt.addEventListener('click', () => offerFile(fname, b));

}
$('cvbCopy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('cvbSrc').textContent); $('cvbStatus').textContent = t('copied'); }
  catch (e) { const rg = document.createRange(); rg.selectNodeContents($('cvbSrc')); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(rg); }
});

// ---------------------------------------------------------------- image loading
async function loadFile(f) {
  try {
    const bmp = await createImageBitmap(f, { colorSpaceConversion: 'none', premultiplyAlpha: 'none' });
    const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
    const ctx = c.getContext('2d', { willReadFrequently: true, colorSpace: 'srgb' }); ctx.drawImage(bmp, 0, 0);
    const d = ctx.getImageData(0, 0, c.width, c.height).data, rgb = new Uint8Array(c.width * c.height * 3);
    for (let i = 0; i < c.width * c.height; i++) {     // transparent pixels become black
      const a = d[i * 4 + 3] / 255; rgb[i * 3] = Math.round(d[i * 4] * a); rgb[i * 3 + 1] = Math.round(d[i * 4 + 1] * a); rgb[i * 3 + 2] = Math.round(d[i * 4 + 2] * a);
    }
    srcImg = { w: c.width, h: c.height, rgb }; srcName = f.name;
    $('imgInfo').textContent = t('loaded') + f.name + ' (' + c.width + ' x ' + c.height + ')';
    run();
  } catch (e) { $('imgInfo').textContent = t('error') + e.message; }
}
$('fileInput').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) loadFile(f); });
const drop = $('drop');
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) loadFile(f); });

// ---------------------------------------------------------------- controls
for (const id of ['pletter', 'normalize', 'fit', 'palette', 'cropX', 'cropY', 'dither', 'strength', 'brightness', 'contrast', 'dedup', 'levels', 'th0', 'th1', 'th2', 'sprites', 'nesMap']) {
  $(id).addEventListener('input', () => { const o = $(id + 'Out'); if (o) o.textContent = $(id).value; renderOptions(); schedule(); });
}
$('zoom').addEventListener('change', () => { if (result) { sizeCanvas($('prevCanvas'), result.preview); sizeCanvas($('origCanvas'), result.preview); } });
// protected area: drag on the machine preview (NES)
let drawing = false, start = null;
$('protectBtn').addEventListener('click', () => { drawing = !drawing; $('protectBtn').setAttribute('aria-pressed', String(drawing)); $('prevCanvas').classList.toggle('drawing', drawing); $('protectBtn').textContent = t(drawing ? 'protectDrawing' : 'protectDraw'); });
$('protectClear').addEventListener('click', () => { protect = null; renderOptions(); schedule(); });
const cpos = (e) => { const c = $('prevCanvas'), r = c.getBoundingClientRect(); return [Math.max(0, Math.min(c.width, Math.round((e.clientX - r.left) * c.width / r.width))), Math.max(0, Math.min(c.height, Math.round((e.clientY - r.top) * c.height / r.height)))]; };
$('prevCanvas').addEventListener('pointerdown', (e) => { if (!drawing || machine !== 'nes') return; start = cpos(e); $('prevCanvas').setPointerCapture(e.pointerId); });
$('prevCanvas').addEventListener('pointerup', (e) => {
  if (!start) return; const p = cpos(e);
  const r = [Math.min(start[0], p[0]), Math.min(start[1], p[1]), Math.max(start[0], p[0]), Math.max(start[1], p[1])];
  start = null; if (r[2] - r[0] >= 2 && r[3] - r[1] >= 2) { protect = r; drawing = false; $('protectBtn').setAttribute('aria-pressed', 'false'); $('prevCanvas').classList.remove('drawing'); $('protectBtn').textContent = t('protectDraw'); renderOptions(); schedule(); }
});
window.setProtect = (r) => { protect = r; renderOptions(); schedule(); };   // used by the test script
$('langBtn').addEventListener('click', () => { lang = lang === 'fr' ? 'en' : 'fr'; try { localStorage.setItem('amyz-lang', lang); } catch (e) {} applyTexts(); });
$('themeBtn').addEventListener('click', () => {
  const r = document.documentElement, cur = r.dataset.theme || 'auto', nx = cur === 'auto' ? 'light' : cur === 'light' ? 'dark' : 'auto';
  if (nx === 'auto') delete r.dataset.theme; else r.dataset.theme = nx;
  try { localStorage.setItem('amyz-theme', nx); } catch (e) {} updateTheme();
});
try { const th = localStorage.getItem('amyz-theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (e) {}
applyTexts();
</script>
